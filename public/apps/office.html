function calcAuction(g,bid,gstPct){
 const comm=commAmt(g),gst=Math.round(comm*num(gstPct)/100),inst=chitInst(g);
 const pool=bid-comm;let div=Math.max(0,pool)/num(g.n);

 if(g.aTimeFrom)t+=', '+g.aTimeFrom+(g.aTimeTo?' to '+g.aTimeTo:'');return t}
function ledger(g,t){
 const e=enrollOf(g.id,t);if(!e||e.pid==='CO')return null;

 const nx=g.divMode==='next',gn=num(g.n);
 const mk=(no,date,dv)=>{const ps=wonNo!=null&&no>wonNo;let div=dv,due=inst-dv;if(ps&&g.psPays==='full'){due=inst;div=0}return{no,date,div,due:Math.round(due*100)/100,ps,paid:0}};
 /* "From the next month": installment 1 is paid at the start with no auction; the auction of month k sets installment k+1 (its due date and dividend) */
 let rows;if(nx){rows=[];if(as.length||(g.start&&g.start<=today()))rows.push(mk(1,g.start||(as[0]&&as[0].date)||'',0));as.forEach(a=>{if(a.no+1<=gn)rows.push(mk(a.no+1,a.dueDate||a.date,a.div))})}
 else rows=as.map(a=>mk(a.no,a.dueDate||a.date,a.div));
 const pool=[],totalPaid=rs.reduce((s,r)=>s+subOf(r),0);
 rs.forEach(r=>{let amt=subOf(r);(r.insts||[]).slice().sort((a,b)=>a-b).forEach(k=>{const row=rows.find(x=>x.no===k);if(!row)return;const x=Math.min(amt,row.due-row.paid);if(x>0){row.paid+=x;(row.pays=row.pays||[]).push({amt:x,date:r.date,rid:r.id});amt-=x}});if(amt>0.0001)pool.push({amt,date:r.date,rid:r.id})});
 rows.forEach(r=>{for(const q of pool){if(r.due-r.paid<=0.005)break;if(q.amt<=0.0001)continue;const x=Math.min(q.amt,r.due-r.paid);r.paid+=x;(r.pays=r.pays||[]).push({amt:x,date:q.date,rid:q.rid});q.amt-=x}});
 const poolLeft=pool.reduce((s,q)=>s+q.amt,0),td=today(),penRows=[];let pen=0;
 /* late fee, per year by the day or per month (every started month counts). Installments paid late are charged only when the group is set to do so. */
 const dd=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5),pm=true,hist=false,rN=S.penNPS==null?1.2:num(S.penNPS),rP=S.penPS==null?1.5:num(S.penPS);

function apState(pid){const l=appL()[pid];return!l?['Not issued','mute']:!l.active?['Disabled','bad']:l.must?['Issued, not yet used','warn']:['Active','good']}
function apIssue(pid,quiet){const pw=apPw();appL()[pid]={user:apUser(pid),pass:hashPass('c|'+pw),must:true,active:true,issued:today(),by:(ST.user||{}).name||''};log('Customer app login issued: '+apUser(pid));if(!quiet){F.apNew={pid,pw,list:null};save();render()}return pw}

function apToggle(pid){const l=appL()[pid];if(!l)return;l.active=!l.active;log('Customer app login '+(l.active?'enabled':'disabled')+': '+l.user);save();note(l.active?'Login switched on.':'Login switched off. The member cannot sign in to the app.')}
function apRemove(pid){askConfirm('Remove the app login of '+pnn(pid)+'? You can issue a new one later.',()=>{delete appL()[pid];log('Customer app login removed: '+apUser(pid));F.apNew=null;save();note('Login removed.')})}

/* ---------- graphs (plain SVG, no outside library) ---------- */
const CHC=['#0b6e63','#d9822b','#3a7bd5','#b3261e','#7a5cc7','#17753a','#c2a000','#586875','#2a9d8f','#e76f51'];
const chF=v=>{const a=Math.abs(v),s=v<0?'-':'';return s+(a>=1e7?+(a/1e7).toFixed(1)+' Cr':a>=1e5?+(a/1e5).toFixed(1)+' L':a>=1e3?+(a/1e3).toFixed(1)+'k':Math.round(a))};
const chM=v=>'₹'+Math.round(v).toLocaleString('en-IN');
const chNice=m=>{if(!(m>0))return 1;const p=Math.pow(10,Math.floor(Math.log10(m))),f=m/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p};
const chWrap=(t,body,leg)=>`<div class="chart"><h3>${esc(t)}</h3>${body}${leg||''}</div>`;
const chLeg=ns=>ns.length>1?`<div class="chleg">${ns.map((n,i)=>`<span><i style="background:${CHC[i%CHC.length]}"></i>${esc(n)}</span>`).join('')}</div>`:'';
function chBar(t,labels,series){if(!labels.length)return'';const W=480,H=230,L=48,B=48,T=10,Rr=8,w=W-L-Rr,h=H-T-B,mx=chNice(Math.max(4,...series.flatMap(s=>s.vals))),gw=w/labels.length,bw=Math.min(36,gw*.72/series.length);let g='';
 for(let i=0;i<=4;i++){const y=T+h-h*i/4;g+=`<line x1="${L}" x2="${W-Rr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--mute)">${chF(mx*i/4)}</text>`}
 labels.forEach((lb,i)=>{const cx=L+gw*i+gw/2;series.forEach((s,j)=>{const v=Math.max(0,s.vals[i]||0),bh=h*v/mx,x=cx-bw*series.length/2+bw*j;g+=`<rect x="${x.toFixed(1)}" y="${(T+h-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${CHC[j%CHC.length]}"><title>${esc(lb+(series.length>1?' · '+s.name:'')+': '+chM(v))}</title></rect>`});
  const rot=labels.length>7;g+=`<text x="${cx.toFixed(1)}" y="${H-B+16}" text-anchor="${rot?'end':'middle'}" font-size="11" fill="var(--mute)"${rot?` transform="rotate(-35 ${cx.toFixed(1)} ${H-B+16})"`:''}>${esc(String(lb).slice(0,16))}</text>`});
 return chWrap(t,`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t)}">${g}</svg>`,chLeg(series.map(s=>s.name)))}
function chHBar(t,labels,vals,cnt){if(!labels.length)return'';const rh=26,W=480,L=140,H=labels.length*rh+8,mx=Math.max(1,...vals),f=cnt?v=>String(Math.round(v)):chF;let g='';
 labels.forEach((lb,i)=>{const y=4+i*rh,bw=(W-L-56)*vals[i]/mx;g+=`<text x="${L-8}" y="${y+16}" text-anchor="end" font-size="12" fill="var(--ink)">${esc(String(lb).slice(0,22))}</text><rect x="${L}" y="${y+3}" width="${Math.max(bw,1).toFixed(1)}" height="${rh-8}" rx="2" fill="${CHC[0]}"><title>${esc(lb+': '+(cnt?vals[i]:chM(vals[i])))}</title></rect><text x="${(L+bw+6).toFixed(1)}" y="${y+16}" font-size="12" fill="var(--mute)">${f(vals[i])}</text>`});
 return chWrap(t,`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t)}">${g}</svg>`)}
function chLine(t,labels,series){if(labels.length<2)return chBar(t,labels,series);const W=480,H=230,L=48,B=40,T=10,Rr=12,w=W-L-Rr,h=H-T-B,all=series.flatMap(s=>s.vals),lo=Math.min(0,...all),hi=chNice(Math.max(4,...all)),sp=hi-lo,X=i=>L+w*i/(labels.length-1),Y=v=>T+h-h*(v-lo)/sp;let g='';
 for(let i=0;i<=4;i++){const v=lo+sp*i/4,y=Y(v);g+=`<line x1="${L}" x2="${W-Rr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--mute)">${chF(v)}</text>`}

const dmNorm=t=>String(t||'').toLowerCase().replace(/[^a-z0-9]/g,'');

function dmMerge(keepId,dropId){const k=P(keepId),d=P(dropId);if(!k||!d||k===d)return;

function ycClose(){const nx=ycNext();if(nx.to>today())return note('That year has not ended yet.','bad');if(!isAdmin())return;
 const S1=ycSum(nx.from,nx.to);askConfirm('Close '+fyLab(nx.from)+'? Entries dated up to '+dmy(nx.to)+' will be locked, and a '+(S1.sur>=0?'surplus':'deficit')+' of '+inr(Math.abs(S1.sur))+' moved to Capital and reserves. You can reopen it later if needed.',()=>{
  const b=acBalances(nx.to,nx.from),lines=[];acAll().forEach(a=>{if(a.group!=='Income'&&a.group!=='Expenses')return;const x=r2(b[a.id]);if(Math.abs(x)<0.005)return;lines.push({a:a.id,dr:x<0?-x:0,cr:x>0?x:0})});
  let vid='';const dif=r2(lines.reduce((s,l)=>s+l.dr-l.cr,0));
  if(lines.length){lines.push({a:'ac2007',dr:dif<0?-dif:0,cr:dif>0?dif:0});S.seq.vch=S.seq.vch||{};const n=S.seq.vch.vouch=(S.seq.vch.vouch||0)+1;vid=uid();S.vouchers=S.vouchers||[];
   S.vouchers.push({id:vid,n,no:'JV '+n,kind:'vouch',type:'Journal',date:nx.to,lines,narr:'Year-end transfer of '+(S1.sur>=0?'surplus':'deficit')+' for '+fyLab(nx.from)+' to Capital and reserves',party:'',ref:'',ye:1})}
  S.lockDate=nx.to;(S.closings=S.closings||[]).push({from:nx.from,to:nx.to,on:today(),by:ST.user?ST.user.name:'',sur:S1.sur,vid});log('Closed the year '+fyLab(nx.from)+', surplus '+inr(S1.sur));save();note('Year '+fyLab(nx.from)+' closed. Entries up to '+dmy(nx.to)+' are locked.')})}
function ycReopen(){const cl=S.closings||[],c=cl[cl.length-1];if(!c||!isAdmin())return;
 askConfirm('Reopen '+fyLab(c.from)+'? The year-end transfer is removed and entries of that year can be changed again.',()=>{S.vouchers=(S.vouchers||[]).filter(v=>v.id!==c.vid);cl.pop();S.lockDate=cl.length?cl[cl.length-1].to:'';log('Reopened the year '+fyLab(c.from));save();note('Year reopened.')})}

const aprPending=()=>{const o=[];S.payouts.forEach(x=>{if(x.apr&&x.apr.st==='pending'){const a=S.auctions.find(y=>y.id===x.aid)||{},g=G(a.gid)||{};o.push({k:'payout',x,t:'Prize payment '+(x.series||'BPY')+' '+(x.vno||''),d:(g.name||'')+' auction '+a.no+', '+pname((enrollOf(a.gid,a.ticket)||{}).pid),amt:num(x.amount)+num(x.adjBP)+num(x.adjAdv),at:x.apr.at,by:x.apr.by})}});
 S.receipts.forEach(r=>{if(r.apr&&r.apr.st==='pending'&&r.cancel)o.push({k:'rcancel',x:r,t:'Receipt '+r.no+' cancelled',d:(G(r.gid)||{}).name+' ticket '+r.ticket+', '+pname(r.pid),amt:num(r.amount),at:r.apr.at,by:r.apr.by})});return o};
function aprAct(k,id,ok){if(!isOwner())return note('Only the owner can approve.','bad');if(k==='payout'){const x=S.payouts.find(y=>y.id===id);if(!x)return;if(ok)x.apr={st:'approved',by:ST.user?ST.user.name:'Owner',at:new Date().toISOString()};else S.payouts=S.payouts.filter(y=>y.id!==id)}
 else{const r=S.receipts.find(y=>y.id===id);if(!r)return;if(ok)r.apr={st:'approved',by:ST.user?ST.user.name:'Owner',at:new Date().toISOString()};else{r.cancel=false;delete r.apr}}

/* typing in a date box: wait until the person has finished before the page redraws */
(()=>{const PD=new Set(),flush=t=>{if(!t||!t._pend)return;t._pend=0;t._typ=0;PD.delete(t);t._re=1;try{t.dispatchEvent(new Event('change',{bubbles:true}))}finally{t._re=0}};
 const isD=t=>t&&t.tagName==='INPUT'&&t.type==='date';
 document.addEventListener('keydown',e=>{const t=e.target;if(!isD(t))return;if(e.key==='Enter'){flush(t);return}if(e.key==='Tab'||e.ctrlKey||e.metaKey||e.altKey)return;t._typ=1},true);
 document.addEventListener('change',e=>{const t=e.target;if(isD(t)&&t._typ&&!t._re){e.stopImmediatePropagation();t._pend=1;PD.add(t)}},true);
 document.addEventListener('input',e=>{const t=e.target;if(isD(t)&&t._typ&&!t._re){e.stopImmediatePropagation()}},true);
 document.addEventListener('click',()=>{[...PD].forEach(flush)},true);
 document.addEventListener('focusout',e=>{const t=e.target;if(!isD(t)||!t._pend)return;const r=e.relatedTarget;if(r&&/^(INPUT|SELECT|TEXTAREA)$/.test(r.tagName))setTimeout(()=>flush(t),0);else setTimeout(()=>flush(t),400)},true)})();

/* paste a date into any date box (15/12/2023, 15-12-2023, 15.12.23, 2023-12-15, 15 Dec 2023) */
function parsePasteDate(t){t=String(t||'').trim();let m,d,mo,y;const MN=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
 if(m=t.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)){y=+m[1];mo=+m[2];d=+m[3]}
 else if(m=t.match(/^(\d{1,2})[-\/. ](\d{1,2})[-\/. ](\d{2}|\d{4})(?!\d)/)){d=+m[1];mo=+m[2];y=+m[3];if(y<100)y+=2000}
 else if(m=t.match(/^(\d{1,2})[-\/. ]*([A-Za-z]{3,9})[-\/. ,]*(\d{2}|\d{4})(?!\d)/)){d=+m[1];mo=MN.indexOf(m[2].slice(0,3).toLowerCase())+1;y=+m[3];if(y<100)y+=2000}
 else return '';
 if(!(mo>=1&&mo<=12&&d>=1&&d<=31&&y>=1900&&y<=2200))return '';const dt=new Date(y,mo-1,d);if(dt.getMonth()!==mo-1)return '';
 return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
document.addEventListener('paste',e=>{const el=e.target;if(!el||el.tagName!=='INPUT'||el.type!=='date')return;
 const txt=(e.clipboardData||window.clipboardData).getData('text'),v=parsePasteDate(txt);e.preventDefault();
 if(!v){note('Could not read "'+String(txt).trim().slice(0,30)+'" as a date. Paste it like 15/12/2023.','bad');return}
 el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))},true);
