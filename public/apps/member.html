 let d={};try{d=await r.json()}catch(e){}

/* ---------- company colours: every shade from the company's main and highlight colours, light and dark.
   A main colour too light for white text is darkened until text reads at 4.5:1. ---------- */
const hexRgb=h=>{h=String(h||'').replace('#','');return/^[0-9a-f]{6}$/i.test(h)?[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)):null};
const rgbHex=c=>'#'+c.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const lumOf=c=>{const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(c[0])+.7152*f(c[1])+.0722*f(c[2])};
const contrastOf=(a,b)=>{const x=lumOf(a),y=lumOf(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const mixC=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const fitC=(c,on,toward)=>{let x=c;for(let i=0;i<40&&contrastOf(x,on)<4.5;i++)x=mixC(x,toward,.06);return x};
function coThemeCss(main,accent){const W=[255,255,255],K=[0,0,0],DB=[13,24,27],m0=hexRgb(main);if(!m0)return'';const a=hexRgb(accent)||m0,h=rgbHex;
 const m=fitC(m0,W,K),dm=fitC(m0,DB,W);
 const L=`--teal:${h(m)};--teal-ink:#ffffff;--soft:${h(mixC(m,W,.88))};--surface:${h(mixC(m,W,.95))};--hero2:${h(fitC(mixC(m0,a,.3),W,K))};--co1:${h(m0)};--co2:${h(a)}`;
 const D=`--teal:${h(dm)};--teal-ink:#06201d;--soft:${h(mixC(dm,DB,.78))};--hero2:${h(dm)};--co1:${h(m0)};--co2:${h(a)}`;
 return`:root,:root[data-theme="light"]{${L}}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){${D}}}:root[data-theme="dark"]{${D}}`}
const coBrand=()=>LV.on&&DATA.brand&&DATA.brand.color?DATA.brand:!st.user&&BR&&BR.color?BR:null;
function applyCoTheme(){const b=coBrand(),css=b?coThemeCss(b.color,b.accent):'';let el=document.getElementById('co-theme');
 if(!el){el=document.createElement('style');el.id='co-theme';document.body.appendChild(el)}if(el.textContent!==css)el.textContent=css;document.documentElement.classList.toggle('co-themed',!!css)}

const chitDue=c=>{const p=c.rows.filter(r=>!r.paid);return{n:p.length,amt:p.reduce((q,r)=>q+owe(r),0),pen:p.reduce((q,r)=>q+r.pen,0)}};
const allDue=()=>DATA.chits.reduce((q,c)=>{const d=chitDue(c);q.amt+=d.amt;q.pen+=d.pen;q.n+=d.n;return q},{amt:0,pen:0,n:0});
const nextAuction=()=>DATA.chits.filter(c=>c.next).map(c=>({c,d:c.next})).sort((a,b)=>a.d.localeCompare(b.d))[0];
function receiptsList(){const out=[];let no=2050;DATA.chits.forEach(c=>c.rows.filter(r=>r.paid).forEach(r=>out.push({k:c.id+r.no,c,r,date:r.paidOn,no:0})));

 const {PDFDocument,StandardFonts,rgb}=PDFLib,doc=await PDFDocument.create(),F=await doc.embedFont(StandardFonts.Helvetica),B=await doc.embedFont(StandardFonts.HelveticaBold),W=595,H=842,M=36,m=DATA.member,rs=v=>'Rs. '+Math.round(v).toLocaleString('en-IN');
 let pg,y;const np=()=>{pg=doc.addPage([W,H]);y=H-M},tx=(x,t,o={})=>pg.drawText(String(t),{x,y,size:o.s||9,font:o.b?B:F,color:o.c||rgb(.1,.1,.1)}),rt=(xr,t,o={})=>{const f=o.b?B:F,s=o.s||9;tx(xr-f.widthOfTextAtSize(String(t),s),t,o)};
 np();tx(M,DATA.company,{s:15,b:1});y-=18;tx(M,'Account statement',{s:11,b:1});y-=14;tx(M,m.name+'  |  Member '+m.mno+'  |  as on '+dmy(iso(T0)),{});y-=12;tx(M,'Period: '+sfLabel(),{});y-=10;
 sfChits().filter(c=>c.rows.length).forEach(c=>{y-=14;if(y<120)np();tx(M,c.group+'  |  Ticket '+c.ticket+'  |  Chit value '+rs(c.amount)+'  |  '+(c.won?'PS':'NPS'),{s:10,b:1});y-=14;
  const cols=[[M,'No'],[M+30,'Month'],[M+110,'Due date'],[M+215,'Installment'],[M+285,'Dividend'],[M+355,'Payable'],[M+425,'Penalty'],[M+480,'Paid on']];
  const hd=()=>{pg.drawRectangle({x:M-2,y:y-4,width:W-2*M+4,height:16,color:rgb(.88,.95,.93)});cols.forEach(([x,t])=>tx(x,t,{b:1,s:8}));y-=16};hd();
  c.rows.forEach(r=>{if(y<60){np();hd()}tx(cols[0][0],r.no);tx(cols[1][0],r.month);tx(cols[2][0],dmy(r.due));tx(cols[3][0],Math.round(r.inst).toLocaleString('en-IN'));tx(cols[4][0],Math.round(r.div).toLocaleString('en-IN'));tx(cols[5][0],Math.round(r.payable).toLocaleString('en-IN'));tx(cols[6][0],r.pen?Math.round(r.pen).toLocaleString('en-IN'):'-');if(r.paid)tx(cols[7][0],dmy(r.paidOn));else tx(cols[7][0],'PENDING',{b:1,c:rgb(.75,.15,.15)});y-=13});
  const pd=c.rows.filter(r=>r.paid),pn=c.rows.filter(r=>!r.paid);y-=4;tx(M,'Paid '+pd.length+': '+rs(pd.reduce((a,r)=>a+r.payable,0))+'   Pending '+pn.length+': '+rs(pn.reduce((a,r)=>a+r.payable,0))+'   Penalty: '+rs(pn.reduce((a,r)=>a+r.pen,0)),{b:1});y-=8});
 doc.getPages().forEach((p,i,all)=>p.drawText('Page '+(i+1)+' of '+all.length+'  |  Computer generated statement',{x:M,y:20,size:7,font:F,color:rgb(.5,.5,.5)}));
 saveFile('chit-account-statement.pdf',await doc.save())}
function scoreView(){const sc=768,pct=Math.round((sc-300)/600*100),lab=sc>=750?t('great'):sc>=700?t('good'):sc>=650?t('fair'):t('poor');
 const all=stmtData(),paid=all.filter(o=>o.r.paid),late=paid.filter(o=>dayDiff(o.r.paidOn,o.r.due)>7).length,pend=all.filter(o=>!o.r.paid).length,ot=paid.length-late;

 <div style="position:relative;height:10px;border-radius:6px;margin-top:16px;background:linear-gradient(90deg,#d64545,#e8a33a,#2f9e6b)"><i style="position:absolute;left:${pct}%;top:-4px;width:4px;height:18px;background:var(--fg,#111);border-radius:2px;transform:translateX(-2px)"></i></div><div class="kv" style="border:0;font-size:.8rem;color:var(--mute)"><span>300</span><span>900</span></div>

 <h2>${t('tips')}</h2><div class="card"><div style="padding:8px 0;border-top:1px solid var(--line)">• ${t('tip1')}</div><div style="padding:8px 0;border-top:1px solid var(--line)">• ${t('tip2')}</div><div style="padding:8px 0;border-top:1px solid var(--line)">• ${t('tip3')}</div></div>`}
function accountCard(){return`<h2>${t('stmt')}</h2><div class="card"><div class="muted" style="font-size:.85rem">${t('stmtSub')}</div><button class="btn block" style="margin-top:10px" onclick="st.tab='stmt';draw()">${t('stmtOpen')}</button></div><h2>${t('score')}</h2><div class="card"><div class="kv"><span>${t('cibil')}</span><b>768</b></div><button class="btn ghost block" style="margin-top:8px" onclick="st.tab='score';draw()">${t('scoreOpen')}</button></div>`}

const TITLES={home:()=>DATA.company,chits:()=>t('chits'),receipts:()=>t('receipts'),auctions:()=>t('auctions'),more:()=>t('more')};

 if(!st.user){a.innerHTML=LV.must?pwView():loginView();return}
 const sub=['chit','pay','live','prize','stmt','score','chpw'].includes(st.tab),title=st.tab==='chpw'?t('chPw'):st.tab==='chit'?((DATA.chits.find(x=>x.id===st.chit)||{}).group||''):st.tab==='pay'?t('pay'):st.tab==='live'?t('liveT'):st.tab==='prize'?t('prizeT'):st.tab==='stmt'?t('stmt'):st.tab==='score'?t('score'):TITLES[st.tab]();
 const view={chpw:chpwView,home:homeView,chits:chitsView,chit:chitView,receipts:receiptsView,auctions:auctionsView,more:moreView,pay:payView,live:liveView,prize:prizeView,stmt:stmtView,score:scoreView}[st.tab]();
 const cur=sub?(st.tab==='stmt'||st.tab==='score'||st.tab==='chpw'?'more':st.tab==='live'||st.tab==='prize'?'auctions':st.chit&&st.tab==='chit'?'chits':'home'):st.tab;
 a.innerHTML=`${st.demo?`<div class="demo">${t('demoBar')}</div>`:''}<header class="top">${sub?`<button class="back" aria-label="${t('back')}" onclick="goBack()">&#8592;</button>`:LV.on&&DATA.brand&&DATA.brand.logo?`<img class="clogo" src="${esc(DATA.brand.logo)}" alt="">`:''}<h1>${esc(title)}</h1></header><main id="mn">${view}</main><nav aria-label="Main">${['home','chits','receipts','auctions','more'].map(k=>`<button onclick="goTab('${k}')" ${cur===k?'aria-current="page"':''}>${svg(k)}${t(k)}</button>`).join('')}</nav>`;
 const m=document.getElementById('mn');if(m&&keepScroll&&!sub)m.scrollTop=keepScroll}
